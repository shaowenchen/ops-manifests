apiVersion: crd.chenshaowen.com/v1
kind: Pipeline
metadata:
  name: set-max-pods
  namespace: ops-system
  labels:
    ops/copilot: enabled
spec:
  desc: set kubelet maxPods and restart kubelet
  tasks:
    - name: whitelist-check
      desc: check whitelist
      taskRef: check-whitelist
    - name: set-max-pods
      desc: set maxPods in kubelet config and restart kubelet
      taskRef: set-max-pods
